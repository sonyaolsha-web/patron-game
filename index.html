<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пес Патрон VS Пригожин</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
        .font-preload {
            font-family: 'Press Start 2P', monospace;
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="font-preload">.</div>

<script>
window.addEventListener('contextmenu', function (e) {
    e.preventDefault();
}, false);

// -------------------------------------------------------------------
// ГЛОБАЛЬНІ ФУНКЦІЇ ТА МЕНЕДЖЕР АУДІО
// -------------------------------------------------------------------
function createGrainTexture(scene) {
    if (scene.textures.exists('grain_texture')) return;
    let canvas = scene.textures.createCanvas('grain_texture', 256, 256);
    let ctx = canvas.context;
    let imgData = ctx.createImageData(256, 256);
    let data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
        let grain = Math.floor(Math.random() * 255);
        data[i] = grain;
        data[i + 1] = grain;
        data[i + 2] = grain;
        data[i + 3] = 20;
    }

    ctx.putImageData(imgData, 0, 0);
    canvas.refresh();
}

function formatTime(seconds) {
    if (seconds === undefined || seconds === null || seconds === Infinity || isNaN(seconds)) return '00:00';
    let mins = Math.floor(seconds / 60);
    let secs = Math.floor(seconds % 60);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// Фонова музика (безперервна між меню)
function playMenuMusic(scene) {
    if (!scene.game.menuMusic) {
        scene.game.menuMusic = scene.sound.add('menu_music', { volume: 0.35, loop: true });
    }
    
    if (!scene.game.menuMusic.isPlaying) {
        if (!scene.sound.locked) {
            scene.game.menuMusic.play();
        } else {
            let unlockAudio = () => {
                if (scene.sound.locked) {
                    scene.sound.unlock();
                }
                if (scene.game.menuMusic && !scene.game.menuMusic.isPlaying) {
                    scene.game.menuMusic.play();
                }
                window.removeEventListener('pointerdown', unlockAudio);
                window.removeEventListener('mousemove', unlockAudio);
                window.removeEventListener('touchstart', unlockAudio);
                window.removeEventListener('keydown', unlockAudio);
            };

            window.addEventListener('pointerdown', unlockAudio, { once: true });
            window.addEventListener('mousemove', unlockAudio, { once: true });
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('keydown', unlockAudio, { once: true });
        }
    }
}

function stopMenuMusic(scene) {
    if (scene.game.menuMusic && scene.game.menuMusic.isPlaying) {
        scene.game.menuMusic.stop();
    }
}

// Єдина уніфікована плашка у напівпрозорому піксельному стилі
function createPixelBox(scene, x, y, width, height, alpha = 0.88) {
    let container = scene.add.container(x, y);

    let outerBorder = scene.add.rectangle(0, 0, width, height, 0x000000);
    let innerBg = scene.add.rectangle(0, 0, width - 8, height - 8, 0x1a120a, alpha);
    let innerFrame = scene.add.rectangle(0, 0, width - 14, height - 14, 0x000000, 0).setStrokeStyle(2, 0x8c6f3e);

    container.add([outerBorder, innerBg, innerFrame]);
    return container;
}

// -------------------------------------------------------------------
// АЧІВКИ
// -------------------------------------------------------------------
function showAchievement(scene, title, description) {
    if (!scene.achievementsUnlocked) scene.achievementsUnlocked = {};
    if (scene.achievementsUnlocked[title]) return; 
    scene.achievementsUnlocked[title] = true;

    let width = 320;
    let height = 64;
    let x = 1280 - width - 20;
    let y = -80; 

    let container = scene.add.container(x, y).setDepth(2000);

    let border = scene.add.rectangle(width/2, height/2, width, height, 0x000000);
    let bg = scene.add.rectangle(width/2, height/2, width - 6, height - 6, 0x1a120a, 0.95).setStrokeStyle(2, 0xffe57f);
    let icon = scene.add.text(20, height/2, '🏆', { fontSize: '20px' }).setOrigin(0.5);

    let titleTxt = scene.add.text(45, 14, title.toUpperCase(), {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '11px',
        fill: '#ffe57f'
    });

    let descTxt = scene.add.text(45, 36, description, {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '9px',
        fill: '#ffffff'
    });

    container.add([border, bg, icon, titleTxt, descTxt]);

    scene.tweens.add({
        targets: container,
        y: 20,
        duration: 400,
        ease: 'Back.easeOut',
        onComplete: () => {
            scene.time.delayedCall(3000, () => {
                scene.tweens.add({
                    targets: container,
                    y: -100,
                    duration: 400,
                    ease: 'Back.easeIn',
                    onComplete: () => container.destroy()
                });
            });
        }
    });
}

// -------------------------------------------------------------------
// 1. MENU SCENE
// -------------------------------------------------------------------
class MenuScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MenuScene' });
    }

    create() {
        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');
            bg.setDisplaySize(1280, 720);
        } else {
            this.add.rectangle(640, 360, 1280, 720, 0x3d301c);
        }

        createGrainTexture(this);
        let grain = this.add.tileSprite(640, 360, 1280, 720, 'grain_texture');
        grain.setAlpha(0.25);

        // Повернено великий розмір заголовку
        this.add.text(644, 134, 'ПЕС ПАТРОН vs ПРИГОЖИН', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '32px',
            fill: '#000000'
        }).setOrigin(0.5);

        this.add.text(640, 130, 'ПЕС ПАТРОН vs ПРИГОЖИН', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '32px',
            fill: '#ffe57f',
            stroke: '#140c03',
            strokeThickness: 8
        }).setOrigin(0.5);

        this.add.text(640, 185, 'ГРА ПРО ХОРОБРОГО ПСА', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '15px',
            fill: '#fff3cd',
            stroke: '#1a0d03',
            strokeThickness: 4
        }).setOrigin(0.5);

        const buttonsData = [
            { text: 'ПОЧАТИ ГРУ', action: () => this.scene.start('LevelSelectScene') },
            { text: 'НАЛАШТУВАННЯ', action: () => this.scene.start('SettingsScene') },
            { text: 'РЕКОРДИ', action: () => this.scene.start('HighscoresScene') },
            { text: 'ВИХІД', action: () => { if (window.close) window.close(); } }
        ];

        let startY = 280;
        let spacingY = 70;

        buttonsData.forEach((btnInfo, index) => {
            this.createPixelMenuButton(640, startY + index * spacingY, btnInfo.text, btnInfo.action);
        });

        playMenuMusic(this);
    }

    createPixelMenuButton(x, y, textLabel, callback) {
        let btnWidth = 280;
        let btnHeight = 52;
        let container = this.add.container(x, y);

        let outerBorder = this.add.rectangle(0, 0, btnWidth, btnHeight, 0x000000);
        let innerBg = this.add.rectangle(0, 0, btnWidth - 6, btnHeight - 6, 0x1a120a, 0.88);
        let innerBorder = this.add.rectangle(0, 0, btnWidth - 12, btnHeight - 12, 0x000000, 0).setStrokeStyle(2, 0x8c6f3e);

        let label = this.add.text(0, 0, textLabel, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '14px',
            fill: '#e6ca94'
        }).setOrigin(0.5);

        container.add([outerBorder, innerBg, innerBorder, label]);
        innerBg.setInteractive({ useHandCursor: true });

        innerBg.on('pointerover', () => {
            innerBg.setFillStyle(0x362714, 0.95);
            innerBorder.setStrokeStyle(2, 0xffe57f);
            label.setStyle({ fill: '#ffffff' });
        });

        innerBg.on('pointerout', () => {
            innerBg.setFillStyle(0x1a120a, 0.88);
            innerBorder.setStrokeStyle(2, 0x8c6f3e);
            label.setStyle({ fill: '#e6ca94' });
        });

        innerBg.on('pointerdown', callback);
    }
}

// -------------------------------------------------------------------
// 2. SETTINGS SCENE
// -------------------------------------------------------------------
class SettingsScene extends Phaser.Scene {
    constructor() {
        super({ key: 'SettingsScene' });
    }

    create() {
        playMenuMusic(this);

        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');
            bg.setDisplaySize(1280, 720);
        } else {
            this.add.rectangle(640, 360, 1280, 720, 0x3d301c);
        }

        let grain = this.add.tileSprite(640, 360, 1280, 720, 'grain_texture');
        grain.setAlpha(0.25);

        createPixelBox(this, 640, 360, 720, 460);

        this.add.text(640, 180, 'НАЛАШТУВАННЯ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffe57f'
        }).setOrigin(0.5);

        this.add.text(340, 260, 'ГУЧНІСТЬ:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        this.createPixelSmallButton(710, 260, '-', () => {
            this.sound.setVolume(Math.max(0, this.sound.volume - 0.1));
            updateVolText();
        });

        this.volText = this.add.text(780, 260, '', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        this.createPixelSmallButton(850, 260, '+', () => {
            this.sound.setVolume(Math.min(1, this.sound.volume + 0.1));
            updateVolText();
        });

        let updateVolText = () => {
            this.volText.setText(Math.round(this.sound.volume * 100) + '%');
        };
        updateVolText();

        this.add.text(340, 330, 'ЗВУК:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        this.soundBtnText = this.createPixelOptionButton(780, 330, this.sound.mute ? 'ВИМК' : 'УВІМК', () => {
            this.sound.mute = !this.sound.mute;
            this.soundBtnText.setText(this.sound.mute ? 'ВИМК' : 'УВІМК');
        });

        this.add.text(340, 400, 'ПОВНИЙ ЕКРАН:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        this.fsBtnText = this.createPixelOptionButton(780, 400, this.scale.isFullscreen ? 'УВІМК' : 'ВИМК', () => {
            if (this.scale.isFullscreen) {
                this.scale.stopFullscreen();
                this.fsBtnText.setText('ВИМК');
            } else {
                this.scale.startFullscreen();
                this.fsBtnText.setText('УВІМК');
            }
        });

        this.createPixelOptionButton(640, 500, 'ПОВЕРНУТИСЯ В МЕНЮ', () => {
            this.scene.start('MenuScene');
        }, 320);
    }

    createPixelSmallButton(x, y, text, callback) {
        let container = this.add.container(x, y);
        let border = this.add.rectangle(0, 0, 40, 40, 0x000000);
        let bg = this.add.rectangle(0, 0, 34, 34, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let txt = this.add.text(0, 0, text, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '18px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        container.add([border, bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => { bg.setFillStyle(0x362714, 0.95); txt.setStyle({ fill: '#ffe57f' }); });
        bg.on('pointerout', () => { bg.setFillStyle(0x1a120a, 0.88); txt.setStyle({ fill: '#ffffff' }); });
        bg.on('pointerdown', callback);
    }

    createPixelOptionButton(x, y, text, callback, width = 160) {
        let container = this.add.container(x, y);
        let border = this.add.rectangle(0, 0, width, 44, 0x000000);
        let bg = this.add.rectangle(0, 0, width - 6, 38, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let txt = this.add.text(0, 0, text, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '12px',
            fill: '#ffe57f'
        }).setOrigin(0.5);

        container.add([border, bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => {
            bg.setFillStyle(0x362714, 0.95);
            bg.setStrokeStyle(2, 0xffe57f);
        });
        bg.on('pointerout', () => {
            bg.setFillStyle(0x1a120a, 0.88);
            bg.setStrokeStyle(2, 0x8c6f3e);
        });
        bg.on('pointerdown', callback);

        return txt;
    }
}

class HighscoresScene extends Phaser.Scene {
    constructor() {

    }

    create() {
        playMenuMusic(this);

        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');

            fontSize: '18px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        this.add.text(640, 370, `КІЛЬКІСТЬ ПЕРЕМОГ: ${winsCount}`, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#73c936'

        let backBtnContainer = this.add.container(640, 490);

        let bg = this.add.rectangle(0, 0, 274, 40, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let txt = this.add.text(0, 0, 'ПОВЕРНУТИСЯ В МЕНЮ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '12px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        backBtnContainer.add([border, bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => { bg.setFillStyle(0x362714, 0.95); txt.setStyle({ fill: '#ffe57f' }); });
        bg.on('pointerout', () => { bg.setFillStyle(0x1a120a, 0.88); txt.setStyle({ fill: '#ffffff' }); });
        bg.on('pointerdown', () => this.scene.start('MenuScene'));

}

// -------------------------------------------------------------------
// 4. LEVEL SELECT SCENE
// -------------------------------------------------------------------
class LevelSelectScene extends Phaser.Scene {
    constructor() {
        super({ key: 'LevelSelectScene' });
        this.currentSelectedLevel = 1;
        this.maxLevels = 4;
    }

    create() {
        playMenuMusic(this);

        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');
            bg.setDisplaySize(1280, 720);
        } else {
            this.add.rectangle(640, 360, 1280, 720, 0x3d301c);
        }

        let grain = this.add.tileSprite(640, 360, 1280, 720, 'grain_texture');
        grain.setAlpha(0.25);

        this.add.text(640, 120, 'ВИБІР РІВНЯ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '26px',
            fill: '#ffe57f',
            stroke: '#000000',
            strokeThickness: 6
        }).setOrigin(0.5);

        // Центральна плашка у співвідношенні 1:1 відносно вмісту
        createPixelBox(this, 640, 360, 380, 280);

        this.levelTitleText = this.add.text(640, 275, '', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        this.levelDescText = this.add.text(640, 335, '', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '12px',
            fill: '#e6ca94',
            align: 'center'
        }).setOrigin(0.5);

        // Кнопка Старт
        this.startLevelContainer = this.add.container(640, 420);
        let sBorder = this.add.rectangle(0, 0, 180, 44, 0x000000);
        let sBg = this.add.rectangle(0, 0, 174, 38, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let sTxt = this.add.text(0, 0, 'ПОЧАТИ', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '14px', fill: '#ffffff'
        }).setOrigin(0.5);

        this.startLevelContainer.add([sBorder, sBg, sTxt]);
        sBg.setInteractive({ useHandCursor: true });

        sBg.on('pointerover', () => { sBg.setFillStyle(0x362714, 0.95); sTxt.setStyle({ fill: '#ffe57f' }); });
        sBg.on('pointerout', () => { sBg.setFillStyle(0x1a120a, 0.88); sTxt.setStyle({ fill: '#ffffff' }); });
        sBg.on('pointerdown', () => {
            if (this.currentSelectedLevel === 1) {
                stopMenuMusic(this);
                this.scene.start('GameScene');
            }
        });

        // Строго КВАДРАТНІ СТРІЛКИ (Співвідношення 1:1, 64x64px)
        this.createSquarePixelArrow(370, 360, '◄', () => {
            if (this.currentSelectedLevel > 1) {
                this.currentSelectedLevel--;
                this.updateLevelDisplay();
            }
        });

        this.createSquarePixelArrow(910, 360, '►', () => {
            if (this.currentSelectedLevel < this.maxLevels) {
                this.currentSelectedLevel++;
                this.updateLevelDisplay();
            }
        });

        // Кнопка Назад
        let backContainer = this.add.container(640, 560);
        let bBorder = this.add.rectangle(0, 0, 260, 40, 0x000000);
        let bBg = this.add.rectangle(0, 0, 254, 34, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let bTxt = this.add.text(0, 0, 'ГОЛОВНЕ МЕНЮ', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '12px', fill: '#cccccc'
        }).setOrigin(0.5);

        backContainer.add([bBorder, bBg, bTxt]);
        bBg.setInteractive({ useHandCursor: true });

        bBg.on('pointerover', () => { bBg.setFillStyle(0x362714, 0.95); bTxt.setStyle({ fill: '#ffffff' }); });
        bBg.on('pointerout', () => { bBg.setFillStyle(0x1a120a, 0.88); bTxt.setStyle({ fill: '#cccccc' }); });
        bBg.on('pointerdown', () => this.scene.start('MenuScene'));

        this.updateLevelDisplay();
    }

    createSquarePixelArrow(x, y, symbol, callback) {
        let container = this.add.container(x, y);
        // Квадратний контур 64x64px (1:1)
        let border = this.add.rectangle(0, 0, 64, 64, 0x000000);
        let bg = this.add.rectangle(0, 0, 56, 56, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let txt = this.add.text(0, 0, symbol, {
            fontFamily: '"Press Start 2P", monospace', fontSize: '26px', fill: '#ffe57f'
        }).setOrigin(0.5);

        container.add([border, bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => { bg.setFillStyle(0x362714, 0.95); bg.setStrokeStyle(2, 0xffe57f); });
        bg.on('pointerout', () => { bg.setFillStyle(0x1a120a, 0.88); bg.setStrokeStyle(2, 0x8c6f3e); });
        bg.on('pointerdown', callback);
    }

    updateLevelDisplay() {
        if (this.currentSelectedLevel === 1) {
            this.levelTitleText.setText('1 РІВЕНЬ');
            this.levelDescText.setText('ОБОРОНА ВЕЖІ\n\nЗахистіть рубежі!');
            this.startLevelContainer.setVisible(true);
        } else {
            this.levelTitleText.setText(`${this.currentSelectedLevel} РІВЕНЬ`);
            this.levelDescText.setText('ЗАБЛОКОВАНО\n\nПройдіть попередні рівні');
            this.startLevelContainer.setVisible(false);
        }
    }
}

// -------------------------------------------------------------------
// 5. GAME SCENE
// -------------------------------------------------------------------
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    create() {
        stopMenuMusic(this);

        this.isGameOver = false;
        this.isWin = false;
        this.isPaused = false;
        this.score = 0;
        this.targetScore = 1488;
        this.lives = 5;
        this.hearts = [];
        
        this.lastFired = 0;
        this.fireRateDelay = 380;
        this.lastTargetX = -1;
        this.lastTargetY = -1;
        this.samePointHits = 0;

        this.elapsedSeconds = 0;
        this.currentTrack = null;
        this.specialTrack = null;
        this.totalKills = 0;

        this.input.mouse.disableContextMenu();

        let bg = this.add.image(640, 360, 'background');
        bg.setDisplaySize(1280, 720).setDepth(0);

        this.patron = this.add.image(170, 230, 'patron').setOrigin(0.5, 0.5).setScale(0.3).setDepth(1);
        this.patron.rotation = 0.2;

        let tower = this.add.image(144, 580, 'tower').setOrigin(0.5, 1).setScale(0.24).setDepth(10);

        this.arrows = this.physics.add.group();
        this.zombies = this.physics.add.group();

        this.pigSound = this.sound.add('pig_sound', { volume: 0.05, rate: 1.0 });

        this.scoreText = this.add.text(30, 30, `Очки: 0 / ${this.targetScore}`, { 
            fontFamily: '"Press Start 2P", monospace', 
            fontSize: '16px', 
            fill: '#ffffff' 
        }).setDepth(100);

        this.timerText = this.add.text(30, 60, 'Час: 00:00', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '14px',
            fill: '#ffe57f'
        }).setDepth(100);

        this.levelTimerEvent = this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (!this.isPaused && !this.isGameOver && !this.isWin) {
                    this.elapsedSeconds++;
                    this.timerText.setText('Час: ' + formatTime(this.elapsedSeconds));

                    if (this.elapsedSeconds === 30 && this.lives === 5) {
                        showAchievement(this, 'Сталеві нерви', '30 сек без втрати життів!');
                    }
                }
            },
            callbackScope: this,
            loop: true
        });

        for (let i = 0; i < 5; i++) {
            let heart = this.add.image(1280 - 45 - (i * 45), 40, 'heart').setScale(0.13).setDepth(100);
            this.hearts.push(heart);
        }

        if (this.textures.exists('btn_pause')) {
            this.hudPauseBtn = this.add.image(50, 100, 'btn_pause').setDisplaySize(36, 36).setDepth(100).setInteractive({ useHandCursor: true });
        } else {
            this.hudPauseBtn = this.add.text(30, 95, '[ II ]', { fontFamily: '"Press Start 2P"', fontSize: '14px', fill: '#fff', backgroundColor: '#000', padding: {x:6, y:4} }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudPauseBtn.on('pointerdown', (p, x, y, e) => { if (e) e.stopPropagation(); this.togglePause(); });

        this.updateHudSoundButton();

        if (this.textures.exists('btn_back')) {
            this.hudBackBtn = this.add.image(150, 100, 'btn_back').setDisplaySize(36, 36).setDepth(100).setInteractive({ useHandCursor: true });
        } else {
            this.hudBackBtn = this.add.text(170, 95, '[ ↩ ]', { fontFamily: '"Press Start 2P"', fontSize: '14px', fill: '#fff', backgroundColor: '#000', padding: {x:6, y:4} }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudBackBtn.on('pointerdown', (p, x, y, e) => { if (e) e.stopPropagation(); this.showExitConfirmModal(); });

        // Пауза
        let pauseOverlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.75).setInteractive();
        let pauseBox = createPixelBox(this, 640, 360, 500, 280);
        let pauseText = this.add.text(640, 260, 'ПАУЗА', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '22px', fill: '#ffffff'
        }).setOrigin(0.5);

        this.createPauseSoundControl(640, 335);

        let pauseSubText = this.add.text(640, 420, 'Натисніть SPACE або ESC', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '11px', fill: '#cccccc'
        }).setOrigin(0.5);

        this.pauseGroup = this.add.group([pauseOverlay, pauseBox, pauseText, pauseSubText]).setDepth(999);
        this.pauseGroup.setVisible(false);

        // Модалка виходу
        let exitOverlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.8).setInteractive();
        let exitBox = createPixelBox(this, 640, 360, 480, 220);
        let exitQuestion = this.add.text(640, 300, 'Вийти в меню?', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '16px', fill: '#ffffff'
        }).setOrigin(0.5);

        let yesBtnContainer = this.add.container(540, 380);
        let yBorder = this.add.rectangle(0, 0, 110, 40, 0x000000);
        let yBg = this.add.rectangle(0, 0, 104, 34, 0x882222).setStrokeStyle(2, 0xff6666);
        let yTxt = this.add.text(0, 0, 'ТАК', { fontFamily: '"Press Start 2P"', fontSize: '12px', fill: '#fff' }).setOrigin(0.5);
        yesBtnContainer.add([yBorder, yBg, yTxt]);
        yBg.setInteractive({ useHandCursor: true });
        yBg.on('pointerdown', () => { this.stopAllMusic(); this.scene.start('MenuScene'); });

        let noBtnContainer = this.add.container(740, 380);
        let nBorder = this.add.rectangle(0, 0, 110, 40, 0x000000);
        let nBg = this.add.rectangle(0, 0, 104, 34, 0x228822).setStrokeStyle(2, 0x66ff66);
        let nTxt = this.add.text(0, 0, 'НІ', { fontFamily: '"Press Start 2P"', fontSize: '12px', fill: '#fff' }).setOrigin(0.5);
        noBtnContainer.add([nBorder, nBg, nTxt]);
        nBg.setInteractive({ useHandCursor: true });
        nBg.on('pointerdown', () => this.hideExitConfirmModal());

        this.exitModalGroup = this.add.group([exitOverlay, exitBox, exitQuestion, yesBtnContainer, noBtnContainer]).setDepth(1000);
        this.exitModalGroup.setVisible(false);

        this.tracksList = ['music_main', 'stefania', 'donbass', 'sorry', 'wagners'];
        this.playRandomTrack();

        this.input.keyboard.on('keydown-SPACE', this.togglePause, this);
        this.input.keyboard.on('keydown-ESC', this.togglePause, this);

        this.zombieSpawnTimer = this.time.addEvent({
            delay: 650,
            callback: this.spawnZombie,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.arrows, this.zombies, this.hitZombie, null, this);
    }

    updateHudSoundButton() {
        if (this.hudSoundBtn) this.hudSoundBtn.destroy();

        let soundTexture = this.sound.mute ? 'btn_sound_off' : 'btn_sound_on';
        if (this.textures.exists(soundTexture)) {
            this.hudSoundBtn = this.add.image(100, 100, soundTexture).setDisplaySize(36, 36).setDepth(100).setInteractive({ useHandCursor: true });
        } else {
            this.hudSoundBtn = this.add.text(100, 95, this.sound.mute ? '[ 🔇 ]' : '[ 🔊 ]', {
                fontFamily: '"Press Start 2P"', fontSize: '14px', fill: '#fff', backgroundColor: '#000', padding: {x:6, y:4}
            }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudSoundBtn.on('pointerdown', (p, x, y, e) => { if (e) e.stopPropagation(); this.toggleSound(); });
    }

    createPauseSoundControl(x, y) {
        if (this.pauseSoundContainer) this.pauseSoundContainer.destroy();

        this.pauseSoundContainer = this.add.container(x, y).setDepth(1000);
        let soundTexture = this.sound.mute ? 'btn_sound_off' : 'btn_sound_on';

        if (this.textures.exists(soundTexture)) {
            let img = this.add.image(0, 0, soundTexture).setDisplaySize(44, 44).setInteractive({ useHandCursor: true });
            let txt = this.add.text(0, 36, this.sound.mute ? 'ЗВУК: ВИМК' : 'ЗВУК: УВІМК', {
                fontFamily: '"Press Start 2P", monospace', fontSize: '12px', fill: '#ffe57f'
            }).setOrigin(0.5);
            this.pauseSoundContainer.add([img, txt]);

            img.on('pointerdown', (p, x, y, e) => { if (e) e.stopPropagation(); this.toggleSound(); });
        } else {
            let btn = this.add.text(0, 0, this.sound.mute ? 'ЗВУК: ВИМК' : 'ЗВУК: УВІМК', {
                fontFamily: '"Press Start 2P", monospace', fontSize: '14px', fill: '#ffe57f', backgroundColor: '#222222', padding: { x: 12, y: 6 }
            }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            this.pauseSoundContainer.add(btn);

            btn.on('pointerdown', (p, x, y, e) => { if (e) e.stopPropagation(); this.toggleSound(); });
        }
        this.pauseSoundContainer.setVisible(false);
    }

    update() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        let pointer = this.input.activePointer;
        if (pointer) {
            let angle = Phaser.Math.Angle.Between(this.patron.x, this.patron.y, pointer.x, pointer.y);
            this.patron.rotation = angle - 0.2;

            if (pointer.isDown) {
                let now = this.time.now;
                if (now - this.lastFired >= this.fireRateDelay) {
                    let dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, this.lastTargetX, this.lastTargetY);
                    if (dist < 15) {
                        this.samePointHits++;
                    } else {
                        this.samePointHits = 0;
                    }

                    this.lastTargetX = pointer.x;
                    this.lastTargetY = pointer.y;

                    if (this.samePointHits < 5) {
                        this.shootArrow(pointer);
                        this.lastFired = now;
                    }
                }
            }
        }

        this.arrows.children.each((arrow) => {
            if (arrow && arrow.active && (arrow.x > 1300 || arrow.y > 750 || arrow.y < -50)) {
                arrow.destroy();
            }
        });

        this.zombies.children.each((zombie) => {
            if (zombie && zombie.active && !zombie.isDying) {
                zombie.y += Math.sin((this.time.now / 200) + zombie.x) * 0.4;

                if (zombie.x < 165) {
                    zombie.isDying = true;
                    zombie.setVelocityX(0);
                    this.takeDamage();

                    this.tweens.add({
                        targets: zombie, scaleX: 0, scaleY: 0, alpha: 0, duration: 300,
                        onComplete: () => zombie.destroy()
                    });
                }
            }
        });
    }

    showExitConfirmModal() {
        if (this.isGameOver || this.isWin) return;
        if (!this.isPaused) this.togglePause();
        this.pauseGroup.setVisible(false);
        if (this.pauseSoundContainer) this.pauseSoundContainer.setVisible(false);
        this.exitModalGroup.setVisible(true);
    }

    hideExitConfirmModal() {
        this.exitModalGroup.setVisible(false);
        if (this.isPaused) this.togglePause();
    }

    toggleSound() {
        this.sound.mute = !this.sound.mute;
        this.updateHudSoundButton();
        this.createPauseSoundControl(640, 335);
        if (this.isPaused && this.pauseSoundContainer) {
            this.pauseSoundContainer.setVisible(true);
        }
    }

    togglePause() {
        if (this.isGameOver || this.isWin) return;

        this.isPaused = !this.isPaused;
        if (this.isPaused) {
            this.physics.pause();
            this.zombieSpawnTimer.paused = true;
            this.pauseGroup.setVisible(true);
            if (this.pauseSoundContainer) this.pauseSoundContainer.setVisible(true);
        } else {
            this.physics.resume();
            this.zombieSpawnTimer.paused = false;
            this.pauseGroup.setVisible(false);
            if (this.pauseSoundContainer) this.pauseSoundContainer.setVisible(false);
            this.exitModalGroup.setVisible(false);
        }
    }

    takeDamage() {
        if (this.isGameOver || this.isWin) return;

        this.lives--;
        if (this.hearts[this.lives]) this.hearts[this.lives].setVisible(false);
        if (this.lives <= 0) this.triggerGameOver();
    }

    // Класичний оверлей та плашка результату (Повернено назад)
    triggerGameOver() {
        this.isGameOver = true;
        if (this.zombieSpawnTimer) this.zombieSpawnTimer.remove();
        if (this.levelTimerEvent) this.levelTimerEvent.remove();
        this.physics.pause();

        this.stopAllMusic();
        this.specialTrack = this.sound.add('game_over', { volume: 0.5 });
        this.specialTrack.play();

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.75).setDepth(1000);
        let box = createPixelBox(this, 640, 360, 520, 280).setDepth(1000);

        let title = this.add.text(640, 260, 'ГРУ ЗАКІНЧЕНО', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '24px', fill: '#ff4444'
        }).setOrigin(0.5).setDepth(1001);

        let restartBtn = this.createResultButton(640, 340, 'ПОЧАТИ ЗНОВУ', () => {
            this.stopAllMusic(); this.scene.restart();
        });

        let menuBtn = this.createResultButton(640, 410, 'ПОВЕРНУТИСЯ В МЕНЮ', () => {
            this.stopAllMusic(); this.scene.start('MenuScene');
        });
    }

    triggerWin() {
        this.isWin = true;
        let completionTime = this.elapsedSeconds;
        let bestTime = localStorage.getItem('patron_best_time');

        if (!bestTime || completionTime < parseFloat(bestTime)) {
            localStorage.setItem('patron_best_time', completionTime);
        }
        let wins = parseInt(localStorage.getItem('patron_wins_count') || 0) + 1;
        localStorage.setItem('patron_wins_count', wins);

        if (this.zombieSpawnTimer) this.zombieSpawnTimer.remove();
        if (this.levelTimerEvent) this.levelTimerEvent.remove();
        this.physics.pause();

        this.stopAllMusic();
        this.specialTrack = this.sound.add('invincible', { volume: 0.5 });
        this.specialTrack.play();

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.75).setDepth(1000);
        let box = createPixelBox(this, 640, 360, 560, 320).setDepth(1000);

        let title = this.add.text(640, 240, 'ПЕРЕМОГА!', {
            fontFamily: '"Press Start 2P", monospace', fontSize: '24px', fill: '#ffe57f'
        }).setOrigin(0.5).setDepth(1001);

        let timeTxt = this.add.text(640, 290, `ЧАС: ${formatTime(completionTime)}`, {
            fontFamily: '"Press Start 2P", monospace', fontSize: '14px', fill: '#ffffff'
        }).setOrigin(0.5).setDepth(1001);

        let retryBtn = this.createResultButton(640, 350, 'ПОВТОРИТИ', () => {
            this.stopAllMusic(); this.scene.restart();
        });

        let menuBtn = this.createResultButton(640, 415, 'ПОВЕРНУТИСЯ В МЕНЮ', () => {
            this.stopAllMusic(); this.scene.start('MenuScene');
        });
    }

    createResultButton(x, y, text, callback) {
        let container = this.add.container(x, y).setDepth(1001);
        let border = this.add.rectangle(0, 0, 280, 42, 0x000000);
        let bg = this.add.rectangle(0, 0, 274, 36, 0x1a120a, 0.88).setStrokeStyle(2, 0x8c6f3e);
        let txt = this.add.text(0, 0, text, {
            fontFamily: '"Press Start 2P", monospace', fontSize: '12px', fill: '#ffe57f'
        }).setOrigin(0.5);

        container.add([border, bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => { bg.setFillStyle(0x362714, 0.95); txt.setStyle({ fill: '#ffffff' }); });
        bg.on('pointerout', () => { bg.setFillStyle(0x1a120a, 0.88); txt.setStyle({ fill: '#ffe57f' }); });
        bg.on('pointerdown', callback);

        return container;
    }

    stopAllMusic() {
        if (this.currentTrack) { this.currentTrack.stop(); this.currentTrack.destroy(); this.currentTrack = null; }
        if (this.specialTrack) { this.specialTrack.stop(); this.specialTrack.destroy(); this.specialTrack = null; }
    }

    playRandomTrack() {
        let selectedKey = this.tracksList[Phaser.Math.Between(0, this.tracksList.length - 1)];
        if (!this.cache.audio.exists(selectedKey)) selectedKey = 'music_main';

        this.currentTrack = this.sound.add(selectedKey, { volume: 0.35 });
        this.currentTrack.once('complete', () => {
            if (!this.isGameOver && !this.isWin) this.playRandomTrack();
        });
        this.currentTrack.play();
    }

    shootArrow(pointer) {
        let arrow = this.arrows.create(this.patron.x, this.patron.y, 'arrow');
        arrow.setScale(0.11).setDepth(11);
        
        let angle = Phaser.Math.Angle.Between(this.patron.x, this.patron.y, pointer.x, pointer.y);
        arrow.rotation = angle;
        this.physics.velocityFromRotation(angle, 800, arrow.body.velocity);
    }

    spawnZombie() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        let groundY = Phaser.Math.Between(520, 690);
        let startX = Phaser.Math.Between(1310, 1380);

        let zombie = this.zombies.create(startX, groundY, 'zombie');
        zombie.setOrigin(0.5, 1).setDepth(Math.floor(groundY));

        let typeRoll = Phaser.Math.Between(1, 100);
        let speed, scale, hp, reward;

        if (typeRoll <= 35) {
            scale = 0.45; speed = Phaser.Math.Between(-280, -210); hp = 1; reward = 30;
        } else if (typeRoll <= 55) {
            scale = 0.85; speed = Phaser.Math.Between(-140, -100); hp = 2; reward = 80;
        } else {
            scale = 0.65; speed = Phaser.Math.Between(-200, -150); hp = 1; reward = 40;
        }

        zombie.setScale(scale);
        zombie.setVelocityX(speed);
        zombie.hp = hp;
        zombie.reward = reward;
    }

    hitZombie(arrow, zombie) {
        if (arrow.active && zombie.active && !zombie.isDying) {
            arrow.destroy();
            zombie.hp -= 1;

            zombie.setTint(0xff0000);
            this.time.delayedCall(70, () => { if (zombie && zombie.active) zombie.clearTint(); });

            if (zombie.hp <= 0) {
                let deathX = zombie.x;
                let groundY = zombie.y - 10;
                let currentDepth = zombie.depth;

                zombie.destroy();
                this.totalKills++;

                if (this.totalKills === 1) showAchievement(this, 'Перша бавовна', 'Знищено першого ворога!');
                if (this.totalKills === 15) showAchievement(this, 'Потужний удар', 'Знищено 15 ворогів!');

                if (this.pigSound) this.pigSound.play();

                let apple = this.add.image(deathX, zombie.y - 30, 'apple').setScale(0.08).setDepth(currentDepth);
                this.tweens.add({
                    targets: apple, y: groundY, duration: 250, ease: 'Bounce.easeOut',
                    onComplete: () => {
                        this.tweens.add({ targets: apple, alpha: 0, duration: 500, delay: 200, onComplete: () => apple.destroy() });
                    }
                });
                
                this.score += zombie.reward || 30;
                this.scoreText.setText(`Очки: ${this.score} / ${this.targetScore}`);

                if (this.score >= this.targetScore && !this.isWin) {
                    this.triggerWin();
                }
            }
        }
    }
}

const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: [PreloaderScene, MenuScene, SettingsScene, HighscoresScene, LevelSelectScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
