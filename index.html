<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пес Патрон VS Пригожин</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let patron, arrows, zombies, apples, scoreText;
let score = 0;
let lastFired = 0;

// Змінні системи життів та паузи
let lives = 5;
let hearts = [];
let isGameOver = false;
let isPaused = false;
let pauseGroup;
let gameOverText, restartText, zombieSpawnTimer;

// Змінні для звуків
let currentTrack = null;
let tracksList = [];
let pigSound;

function preload() {
    // Графіка та основні аудіо
    this.load.image('background', 'assets/background.png');
    this.load.image('tower', 'assets/tower.png');
    this.load.image('patron', 'assets/patron.png');
    this.load.image('arrow', 'assets/arrow.png');
    this.load.image('zombie', 'assets/zombie.png');
    this.load.image('heart', 'assets/heart.png');
    this.load.image('apple', 'assets/apple.png');

    this.load.audio('pig_sound', 'assets/pig.mp3');
    this.load.audio('music_main', 'assets/music_main.mp3');
}

function create() {
    isGameOver = false;
    isPaused = false;
    score = 0;
    lives = 5;
    hearts = [];

    let bg = this.add.image(640, 360, 'background');
    bg.setDisplaySize(1280, 720);
    bg.setDepth(0);

    // Пес Патрон розташований ЗА вежею (depth = 1) та трохи нижче (Y = 275)
    patron = this.add.image(195, 275, 'patron').setOrigin(0.5, 0.5);
    patron.setScale(0.30);
    patron.setDepth(1);
    patron.angle = -15; // Початковий нахил вгору на 15 градусів

    // Вежа поверх Пса Патрона (depth = 2)
    let tower = this.add.image(180, 450, 'tower');
    tower.setScale(0.8);
    tower.setDepth(2);

    arrows = this.physics.add.group();
    zombies = this.physics.add.group();
    apples = this.add.group();

    pigSound = this.sound.add('pig_sound', { volume: 0.35 });

    scoreText = this.add.text(40, 40, 'Очки: 0', { 
        fontFamily: '"Press Start 2P", monospace', 
        fontSize: '20px', 
        fill: '#ffffff' 
    });
    scoreText.setDepth(100);

    for (let i = 0; i < 5; i++) {
        let heart = this.add.image(1280 - 60 - (i * 65), 55, 'heart');
        heart.setScale(0.16); 
        heart.setDepth(100);
        hearts.push(heart);
    }

    let pauseOverlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.6);
    let pauseText = this.add.text(640, 320, 'ПАУЗА', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '44px',
        fill: '#ffffff'
    }).setOrigin(0.5);
    let pauseSubText = this.add.text(640, 400, 'Натисніть P для продовження', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '18px',
        fill: '#cccccc'
    }).setOrigin(0.5);

    pauseGroup = this.add.group([pauseOverlay, pauseText, pauseSubText]);
    pauseGroup.setDepth(999);
    pauseGroup.setVisible(false);

    tracksList = [
        { key: 'music_main', weight: 70 },
        { key: 'stefania',   weight: 6  },
        { key: 'donbass',    weight: 6  },
        { key: 'sorry',      weight: 6  },
        { key: 'wagners',    weight: 6  },
        { key: 'invincible', weight: 6  }
    ];

    // Дозавантаження додаткових треків у фоні
    this.load.audio('stefania', 'assets/stefania.mp3');
    this.load.audio('donbass', 'assets/donbass.mp3');
    this.load.audio('sorry', 'assets/sorry.mp3');
    this.load.audio('wagners', 'assets/wagners.mp3');
    this.load.audio('invincible', 'assets/invincible.mp3');
    this.load.start();

    this.input.once('pointerdown', () => {
        if (this.sound.context.state === 'suspended') {
            this.sound.context.resume();
        }
        if (!currentTrack || !currentTrack.isPlaying) {
            playWeightedTrack.call(this);
        }
    });

    this.input.on('pointerdown', (pointer) => {
        if (isGameOver || isPaused) return;
        
        let time = this.time.now;
        if (time > lastFired) {
            shootArrow.call(this, pointer);
            lastFired = time + 400;
        }
    });

    this.input.keyboard.on('keydown-P', togglePause, this);
    this.input.keyboard.on('keydown-ESC', togglePause, this);

    zombieSpawnTimer = this.time.addEvent({
        delay: 1400,
        callback: spawnZombie,
        callbackScope: this,
        loop: true
    });

    this.physics.add.overlap(arrows, zombies, hitZombie, null, this);
}

function update() {
    if (isGameOver || isPaused) return;

    let pointer = this.input.activePointer;
    // Обертання з урахуванням вихідного нахилу (-15 градусів)
    let angle = Phaser.Math.Angle.Between(patron.x, patron.y, pointer.x, pointer.y);
    patron.rotation = angle - Phaser.Math.DegToRad(15);

    arrows.children.each((arrow) => {
        if (arrow && arrow.active) {
            if (arrow.x > 1300 || arrow.y > 750 || arrow.y < -50 || arrow.x < -50) {
                arrow.destroy();
            }
        }
    });

    zombies.children.each((zombie) => {
        if (zombie && zombie.active && zombie.x < 180) {
            zombie.destroy();
            takeDamage.call(this);
        }
    });
}

function togglePause() {
    if (isGameOver) return;

    isPaused = !isPaused;

    if (isPaused) {
        this.physics.pause();
        zombieSpawnTimer.paused = true;
        pauseGroup.setVisible(true);
    } else {
        this.physics.resume();
        zombieSpawnTimer.paused = false;
        pauseGroup.setVisible(false);
    }
}

function takeDamage() {
    if (isGameOver) return;

    lives--;
    if (hearts[lives]) {
        hearts[lives].setVisible(false);
    }

    if (lives <= 0) {
        triggerGameOver.call(this);
    }
}

function triggerGameOver() {
    isGameOver = true;
    
    if (zombieSpawnTimer) zombieSpawnTimer.remove();
    this.physics.pause();

    if (currentTrack && currentTrack.isPlaying) {
        this.tweens.add({
            targets: currentTrack,
            volume: 0.08,
            duration: 1000
        });
    }

    // Покриття Game Over та текст виставлені на високу глибину (depth: 1000)
    let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.65);
    overlay.setDepth(1000);

    gameOverText = this.add.text(640, 300, 'ГРУ ЗАКІНЧЕНО', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '44px',
        fill: '#ffffff',
        align: 'center'
    }).setOrigin(0.5);
    gameOverText.setDepth(1001);

    restartText = this.add.text(640, 400, 'ПОЧАТИ ЗНОВУ', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '26px',
        fill: '#ffffff',
        align: 'center'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    restartText.setDepth(1001);

    restartText.on('pointerover', () => restartText.setStyle({ fill: '#ffcc00' }));
    restartText.on('pointerout', () => restartText.setStyle({ fill: '#ffffff' }));

    restartText.on('pointerdown', () => {
        if (currentTrack) {
            currentTrack.stop();
        }
        this.scene.restart();
    });
}

function playWeightedTrack() {
    let totalWeight = tracksList.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Phaser.Math.Between(1, totalWeight);
    let selectedKey = tracksList[0].key;

    for (let track of tracksList) {
        if (randomNum <= track.weight) {
            selectedKey = track.key;
            break;
        }
        randomNum -= track.weight;
    }

    if (!this.cache.audio.exists(selectedKey)) {
        selectedKey = 'music_main';
    }

    currentTrack = this.sound.add(selectedKey, { volume: 0.5 });

    currentTrack.once('complete', () => {
        if (!isGameOver) {
            playWeightedTrack.call(this);
        }
    });

    currentTrack.play();
}

function shootArrow(pointer) {
    let arrow = arrows.create(patron.x, patron.y, 'arrow');
    arrow.setScale(0.15);
    arrow.setDepth(3);
    
    let angle = Phaser.Math.Angle.Between(patron.x, patron.y, pointer.x, pointer.y);
    arrow.rotation = angle;
    
    this.physics.velocityFromRotation(angle, 600, arrow.body.velocity);
}

// Хаотичний спавн зомбі по розширеній висоті
function spawnZombie() {
    if (isGameOver || isPaused) return;
    
    let delay = Phaser.Math.Between(0, 300);
    
    this.time.delayedCall(delay, () => {
        if (isGameOver || isPaused) return;

        // Розширений хаотичний діапазон по висоті (від 570 до 660)
        let groundY = Phaser.Math.Between(570, 660);
        let startX = Phaser.Math.Between(1310, 1370);

        let zombie = zombies.create(startX, groundY, 'zombie');
        zombie.setOrigin(0.5, 1);

        // Динамічний depth від 10 до 100 залежно від Y-координати
        let depthValue = Math.floor(Phaser.Math.MapLinear(groundY, 570, 660, 10, 90));
        zombie.setDepth(depthValue);

        let typeRoll = Phaser.Math.Between(1, 100);
        let speed, scale, hp, reward;

        if (typeRoll <= 25) {
            scale = 0.45;
            speed = Phaser.Math.Between(-190, -140);
            hp = 1;
            reward = 10;
        } else if (typeRoll <= 40) {
            scale = 0.85;
            speed = Phaser.Math.Between(-65, -40);
            hp = 3;
            reward = 30;
        } else {
            scale = 0.65;
            speed = Phaser.Math.Between(-110, -70);
            hp = 1;
            reward = 10;
        }

        zombie.setScale(scale);
        zombie.setVelocityX(speed);
        
        zombie.hp = hp;
        zombie.reward = reward;
    });
}

function hitZombie(arrow, zombie) {
    if (arrow.active && zombie.active) {
        arrow.destroy();

        zombie.hp -= 1;

        zombie.setTint(0xff0000);
        this.time.delayedCall(100, () => {
            if (zombie && zombie.active) {
                zombie.clearTint();
            }
        });

        if (zombie.hp <= 0) {
            let deathX = zombie.x;
            let startY = zombie.y - (zombie.height * zombie.scaleY * 0.5); 
            let groundY = zombie.y - 10; 
            let earnedPoints = zombie.reward || 10;
            let currentDepth = zombie.depth;

            zombie.destroy();

            if (pigSound) {
                pigSound.play();
            }

            let apple = this.add.image(deathX, startY, 'apple');
            apple.setScale(0.08);
            apple.setDepth(currentDepth);

            this.tweens.add({
                targets: apple,
                y: groundY,
                duration: 400,
                ease: 'Bounce.easeOut',
                onComplete: () => {
                    this.tweens.add({
                        targets: apple,
                        alpha: 0,
                        duration: 1000,
                        delay: 600,
                        onComplete: () => {
                            apple.destroy();
                        }
                    });
                }
            });
            
            score += earnedPoints;
            scoreText.setText('Очки: ' + score);
        }
    }
}
</script>

</body>
</html>
