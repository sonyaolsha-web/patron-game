<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пес Патрон VS Пригожин</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
        .font-preload {
            font-family: 'Press Start 2P', monospace;
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="font-preload">.</div>

<script>
window.addEventListener('contextmenu', function (e) {
    e.preventDefault();
}, false);

function createGrainTexture(scene) {
    if (scene.textures.exists('grain_texture')) return;
    
    let canvas = scene.textures.createCanvas('grain_texture', 256, 256);
    let ctx = canvas.context;
    let imgData = ctx.createImageData(256, 256);
    let data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
        let grain = Math.floor(Math.random() * 255);
        data[i] = grain;
        data[i + 1] = grain;
        data[i + 2] = grain;
        data[i + 3] = 25;
    }

    ctx.putImageData(imgData, 0, 0);
    canvas.refresh();
}

function formatTime(seconds) {
    if (seconds === undefined || seconds === null || seconds === Infinity || isNaN(seconds)) return '00:00';
    let mins = Math.floor(seconds / 60);
    let secs = Math.floor(seconds % 60);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// Глобальний менеджер фонової музики меню
function playMenuMusic(scene) {
    if (!scene.game.menuMusic) {
        scene.game.menuMusic = scene.sound.add('menu_music', { volume: 0.5, loop: true });
    }
    
    if (!scene.game.menuMusic.isPlaying) {
        if (!scene.sound.locked) {
            scene.game.menuMusic.play();
        } else {
            let unlockAudio = () => {
                if (scene.sound.locked) {
                    scene.sound.unlock();
                }
                if (scene.game.menuMusic && !scene.game.menuMusic.isPlaying) {
                    scene.game.menuMusic.play();
                }
                window.removeEventListener('pointerdown', unlockAudio);
                window.removeEventListener('mousemove', unlockAudio);
                window.removeEventListener('touchstart', unlockAudio);
                window.removeEventListener('keydown', unlockAudio);
            };

            window.addEventListener('pointerdown', unlockAudio, { once: true });
            window.addEventListener('mousemove', unlockAudio, { once: true });
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('keydown', unlockAudio, { once: true });
        }
    }
}

function stopMenuMusic(scene) {
    if (scene.game.menuMusic && scene.game.menuMusic.isPlaying) {
        scene.game.menuMusic.stop();
    }
}

// 1. СЦЕНА: ГОЛОВНЕ МЕНЮ

class MenuScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MenuScene' });
    }

    create() {
        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');
            bg.setDisplaySize(1280, 720);
        } else {
            this.add.rectangle(640, 360, 1280, 720, 0x3d301c);
        }

        createGrainTexture(this);
        let grain = this.add.tileSprite(640, 360, 1280, 720, 'grain_texture');
        grain.setAlpha(0.25);

        this.add.text(644, 114, 'ПЕС ПАТРОН vs ПРИГОЖИН', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '38px',
            fill: '#000000',
            align: 'center'
        }).setOrigin(0.5).setAlpha(0.7);

        this.add.text(640, 110, 'ПЕС ПАТРОН vs ПРИГОЖИН', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '38px',
            fill: '#ffe57f',
            stroke: '#140c03',
            strokeThickness: 10,
            align: 'center'
        }).setOrigin(0.5);

        this.add.text(640, 168, '🐾 ГРА ПРО ХОРОБРОГО ПСА 🐾', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#fff3cd',
            stroke: '#1a0d03',
            strokeThickness: 5,
            align: 'center'
        }).setOrigin(0.5);

        const buttonsData = [
            { text: 'ПОЧАТИ ГРУ', action: () => {
                this.scene.start('LevelSelectScene');
            }},
            { text: 'НАЛАШТУВАННЯ', action: () => {
                this.scene.start('SettingsScene');
            }},
            { text: 'РЕКОРДИ', action: () => {
                this.scene.start('HighscoresScene');
            }},
            { text: 'ВИХІД', action: () => {
                if (window.close) window.close();
            }}
        ];

        let startY = 275;
        let spacingY = 75;

        buttonsData.forEach((btnInfo, index) => {
            let btnY = startY + index * spacingY;
            this.createPixelMenuButton(640, btnY, btnInfo.text, btnInfo.action);
        });

        playMenuMusic(this);
    }

    createPixelMenuButton(x, y, textLabel, callback, width = 280) {
        let btnHeight = 54;

        let container = this.add.container(x, y);

        let bgOuter = this.add.rectangle(0, 0, width, btnHeight, 0x120d07).setStrokeStyle(4, 0x8c6f3e);
        let bgInner = this.add.rectangle(0, 0, width - 8, btnHeight - 8, 0x362714);

        let label = this.add.text(0, 0, textLabel, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '14px',
            fill: '#e6ca94',
            align: 'center'
        }).setOrigin(0.5);

        container.add([bgOuter, bgInner, label]);

        bgInner.setInteractive({ useHandCursor: true });

        bgInner.on('pointerover', () => {
            bgOuter.setStrokeStyle(4, 0xffe57f);
            bgInner.setFillStyle(0x543e20);
            label.setStyle({ fill: '#ffffff' });
        });

        bgInner.on('pointerout', () => {
            bgOuter.setStrokeStyle(4, 0x8c6f3e);
            bgInner.setFillStyle(0x362714);
            label.setStyle({ fill: '#e6ca94' });
        });

        bgInner.on('pointerdown', callback);
    }
}

class SettingsScene extends Phaser.Scene {
    constructor() {
        super({ key: 'SettingsScene' });
    }

    create() {
        playMenuMusic(this);

        if (this.textures.exists('menu_bg')) {
            let bg = this.add.image(640, 360, 'menu_bg');
            bg.setDisplaySize(1280, 720);
        } else {
            this.add.rectangle(640, 360, 1280, 720, 0x3d301c);
        }

        let grain = this.add.tileSprite(640, 360, 1280, 720, 'grain_texture');
        grain.setAlpha(0.25);

        this.add.rectangle(640, 360, 750, 480, 0x1a120a, 0.9).setStrokeStyle(4, 0x8c6f3e);

        this.add.text(640, 170, 'НАЛАШТУВАННЯ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '32px',
            fill: '#ffe57f',
            stroke: '#000',
            strokeThickness: 6
        }).setOrigin(0.5);

        this.add.text(320, 260, 'ГУЧНІСТЬ:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        let volMinus = this.createSmallButton(720, 260, '-', () => {
            let currentVol = this.sound.volume;
            this.sound.setVolume(Math.max(0, currentVol - 0.1));
            updateVolText();
        });

        this.volText = this.add.text(800, 260, '', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        let volPlus = this.createSmallButton(880, 260, '+', () => {
            let currentVol = this.sound.volume;
            this.sound.setVolume(Math.min(1, currentVol + 0.1));
            updateVolText();
        });

        let updateVolText = () => {
            this.volText.setText(Math.round(this.sound.volume * 100) + '%');
        };
        updateVolText();

        this.add.text(320, 340, 'ЗВУК:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        this.soundBtnText = this.createOptionButton(800, 340, this.sound.mute ? 'ВИМК' : 'УВІМК', () => {
            this.sound.mute = !this.sound.mute;
            this.soundBtnText.setText(this.sound.mute ? 'ВИМК' : 'УВІМК');
        });

        this.add.text(320, 420, 'ПОВНИЙ ЕКРАН:', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#e6ca94'
        }).setOrigin(0, 0.5);

        let isFS = this.scale.isFullscreen;
        this.fsBtnText = this.createOptionButton(800, 420, isFS ? 'УВІМК' : 'ВИМК', () => {
            if (this.scale.isFullscreen) {
                this.scale.stopFullscreen();
                this.fsBtnText.setText('ВИМК');
            } else {
                this.scale.startFullscreen();
                this.fsBtnText.setText('УВІМК');
            }
        });

        this.createOptionButton(640, 520, 'НАЗАД В МЕНЮ', () => {
            this.scene.start('MenuScene');
        }, 300);
    }

    createSmallButton(x, y, text, callback) {
        let btn = this.add.text(x, y, text, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#362714',
            padding: { x: 15, y: 8 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        btn.on('pointerover', () => btn.setStyle({ fill: '#ffe57f', backgroundColor: '#543e20' }));
        btn.on('pointerout', () => btn.setStyle({ fill: '#ffffff', backgroundColor: '#362714' }));
        btn.on('pointerdown', callback);
        return btn;
    }

    createOptionButton(x, y, text, callback, width = 180) {
        let container = this.add.container(x, y);
        let bg = this.add.rectangle(0, 0, width, 44, 0x362714).setStrokeStyle(3, 0x8c6f3e);
        let txt = this.add.text(0, 0, text, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '18px',
            fill: '#ffe57f'
        }).setOrigin(0.5);

        container.add([bg, txt]);
        bg.setInteractive({ useHandCursor: true });

        bg.on('pointerover', () => {
            bg.setStrokeStyle(3, 0xffe57f);
            bg.setFillStyle(0x543e20);
        });
        bg.on('pointerout', () => {
            bg.setStrokeStyle(3, 0x8c6f3e);
            bg.setFillStyle(0x362714);
        });
        bg.on('pointerdown', callback);

        return txt;
    }
}

class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    create() {
        stopMenuMusic(this);

        this.isGameOver = false;
        this.isWin = false;
        this.isPaused = false;
        this.score = 0;
        this.lives = 5;
        this.hearts = [];
        
        this.lastFired = 0;
        this.fireRateDelay = 350; 
        this.elapsedSeconds = 0;

        this.currentTrack = null;
        this.specialTrack = null;
        this.winTimerEvent = null;
        this.isFirstTrack = true;

        this.input.mouse.disableContextMenu();

        let bg = this.add.image(640, 360, 'background');
        bg.setDisplaySize(1280, 720);
        bg.setDepth(0);

        this.patron = this.add.image(170, 230, 'patron').setOrigin(0.5, 0.5);
        this.patron.setScale(0.3);
        this.patron.setDepth(1);
        this.patron.rotation = 0;

        let tower = this.add.image(144, 580, 'tower');
        tower.setOrigin(0.5, 1);
        tower.setScale(0.24);
        tower.setDepth(10);

        this.arrows = this.physics.add.group();
        this.zombies = this.physics.add.group();
        this.apples = this.add.group();

        this.pigSound = this.sound.add('pig_sound', { volume: 0.12 });

        this.scoreText = this.add.text(40, 40, 'Очки: 0 / 1488', { 
            fontFamily: '"Press Start 2P", monospace', 
            fontSize: '20px', 
            fill: '#ffffff' 
        }).setDepth(100);

        this.timerText = this.add.text(40, 70, 'Час: 00:00', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#ffe57f'
        }).setDepth(100);

        this.levelTimerEvent = this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (!this.isPaused && !this.isGameOver && !this.isWin) {
                    this.elapsedSeconds++;
                    this.timerText.setText('Час: ' + formatTime(this.elapsedSeconds));
                }
            },
            callbackScope: this,
            loop: true
        });

        for (let i = 0; i < 5; i++) {
            let heart = this.add.image(1280 - 60 - (i * 65), 55, 'heart');
            heart.setScale(0.16); 
            heart.setDepth(100);
            this.hearts.push(heart);
        }

        let pauseKey = this.textures.exists('btn_pause') ? 'btn_pause' : null;
        let soundOnKey = this.textures.exists('btn_sound_on') ? 'btn_sound_on' : null;
        let soundOffKey = this.textures.exists('btn_sound_off') ? 'btn_sound_off' : null;
        let backKey = this.textures.exists('btn_back') ? 'btn_back' : null;

        if (pauseKey) {
            this.hudPauseBtn = this.add.image(50, 115, 'btn_pause').setDepth(100).setInteractive({ useHandCursor: true });
            this.hudPauseBtn.setDisplaySize(40, 40);
        } else {
            this.hudPauseBtn = this.add.text(40, 105, '[ II ]', { fontFamily: '"Press Start 2P"', fontSize: '18px', fill: '#fff', backgroundColor: '#000', padding: {x:8, y:5} }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudPauseBtn.on('pointerdown', (p, x, y, e) => { e.stopPropagation(); this.togglePause(); });

        let currentSoundTexture = this.sound.mute ? soundOffKey : soundOnKey;
        if (currentSoundTexture) {
            this.hudSoundBtn = this.add.image(105, 115, currentSoundTexture).setDepth(100).setInteractive({ useHandCursor: true });
            this.hudSoundBtn.setDisplaySize(40, 40);
        } else {
            this.hudSoundBtn = this.add.text(125, 105, this.sound.mute ? '[ 🔇 ]' : '[ 🔊 ]', { fontFamily: '"Press Start 2P"', fontSize: '18px', fill: '#fff', backgroundColor: '#000', padding: {x:8, y:5} }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudSoundBtn.on('pointerdown', (p, x, y, e) => { e.stopPropagation(); this.toggleSound(); });

        if (backKey) {
            this.hudBackBtn = this.add.image(160, 115, 'btn_back').setDepth(100).setInteractive({ useHandCursor: true });
            this.hudBackBtn.setDisplaySize(40, 40);
        } else {
            this.hudBackBtn = this.add.text(210, 105, '[ ↩ ]', { fontFamily: '"Press Start 2P"', fontSize: '18px', fill: '#fff', backgroundColor: '#000', padding: {x:8, y:5} }).setDepth(100).setInteractive({ useHandCursor: true });
        }
        this.hudBackBtn.on('pointerdown', (p, x, y, e) => { e.stopPropagation(); this.showExitConfirmModal(); });

        let pauseOverlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.65).setInteractive();
        let pauseText = this.add.text(640, 260, 'ПАУЗА', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '44px',
            fill: '#ffffff'
        }).setOrigin(0.5);

        let soundStatusText = this.sound.mute ? 'ЗВУК: ВИМК' : 'ЗВУК: УВІМК';
        this.muteBtn = this.add.text(640, 360, soundStatusText, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffcc00',
            backgroundColor: '#222222',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        this.muteBtn.on('pointerdown', (p, x, y, e) => {
            if (e) e.stopPropagation();
            this.toggleSound();
        });

        let isTouchDevice = this.sys.game.device.input.touch;
        let hintMsg = isTouchDevice 
            ? 'Натисніть на екран або [ II ] для продовження' 
            : 'Натисніть SPACE, ESC або [ II ] для продовження';

        let pauseSubText = this.add.text(640, 450, hintMsg, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '15px',
            fill: '#cccccc',
            align: 'center'
        }).setOrigin(0.5);

        pauseOverlay.on('pointerdown', () => {
            if (this.isPaused && !this.exitModalGroup.visible) {
                this.togglePause();
            }
        });

        this.pauseGroup = this.add.group([pauseOverlay, pauseText, this.muteBtn, pauseSubText]);
        this.pauseGroup.setDepth(999);
        this.pauseGroup.setVisible(false);

        let exitOverlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.75).setInteractive();
        let exitQuestion = this.add.text(640, 280, 'Ви точно хочете вийти в меню?', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            align: 'center'
        }).setOrigin(0.5);

        let yesBtn = this.add.text(500, 400, 'ТАК', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '24px',
            fill: '#ffffff',
            backgroundColor: '#882222',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        let noBtn = this.add.text(780, 400, 'НІ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '24px',
            fill: '#ffffff',
            backgroundColor: '#228822',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        yesBtn.on('pointerover', () => yesBtn.setStyle({ fill: '#ffcc00' }));
        yesBtn.on('pointerout', () => yesBtn.setStyle({ fill: '#ffffff' }));
        yesBtn.on('pointerdown', (p, x, y, e) => {
            e.stopPropagation();
            this.stopAllMusic();
            this.scene.start('MenuScene');
        });

        noBtn.on('pointerover', () => noBtn.setStyle({ fill: '#ffcc00' }));
        noBtn.on('pointerout', () => noBtn.setStyle({ fill: '#ffffff' }));
        noBtn.on('pointerdown', (p, x, y, e) => {
            e.stopPropagation();
            this.hideExitConfirmModal();
        });

        this.exitModalGroup = this.add.group([exitOverlay, exitQuestion, yesBtn, noBtn]);
        this.exitModalGroup.setDepth(1000);
        this.exitModalGroup.setVisible(false);

        this.tracksList = ['music_main', 'stefania', 'donbass', 'sorry', 'wagners'];
        this.playNextTrack();

        this.input.on('pointerdown', (pointer) => {
            if (this.isGameOver || this.isWin || this.isPaused) return;

            let now = this.time.now;
            if (now - this.lastFired >= this.fireRateDelay) {
                this.shootArrow(pointer);
                this.lastFired = now;
            }
        });

        this.input.keyboard.on('keydown-SPACE', this.togglePause, this);
        this.input.keyboard.on('keydown-ESC', this.togglePause, this);

        this.zombieSpawnTimer = this.time.addEvent({
            delay: 900,
            callback: this.spawnZombie,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.arrows, this.zombies, this.hitZombie, null, this);
    }

    update() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        let pointer = this.input.activePointer;
        if (pointer) {
            let targetX = pointer.x || this.input.x;
            let targetY = pointer.y || this.input.y;
            let angle = Phaser.Math.Angle.Between(this.patron.x, this.patron.y, targetX, targetY);
            this.patron.rotation = angle;
        }

        this.arrows.children.each((arrow) => {
            if (arrow && arrow.active) {
                if (arrow.x > 1300 || arrow.y > 750 || arrow.y < -50 || arrow.x < -50) {
                    arrow.destroy();
                }
            }
        });

        this.zombies.children.each((zombie) => {
            if (zombie && zombie.active && zombie.x < 165 && !zombie.isDying) {
                zombie.isDying = true;
                zombie.setVelocityX(0);
                
                this.takeDamage();

                this.tweens.add({
                    targets: zombie,
                    scaleX: 0,
                    scaleY: 0,
                    alpha: 0,
                    duration: 400,
                    onComplete: () => {
                        zombie.destroy();
                    }
                });
            }
        });
    }

    showExitConfirmModal() {
        if (this.isGameOver || this.isWin) return;
        if (!this.isPaused) {
            this.togglePause();
        }
        this.pauseGroup.setVisible(false);
        this.exitModalGroup.setVisible(true);
    }

    hideExitConfirmModal() {
        this.exitModalGroup.setVisible(false);
        if (this.isPaused) {
            this.togglePause();
        }
    }

    toggleSound() {
        this.sound.mute = !this.sound.mute;
        
        let soundOnKey = this.textures.exists('btn_sound_on') ? 'btn_sound_on' : null;
        let soundOffKey = this.textures.exists('btn_sound_off') ? 'btn_sound_off' : null;

        if (this.hudSoundBtn) {
            if (this.hudSoundBtn.setTexture) {
                this.hudSoundBtn.setTexture(this.sound.mute ? soundOffKey : soundOnKey);
            } else {
                this.hudSoundBtn.setText(this.sound.mute ? '[ 🔇 ]' : '[ 🔊 ]');
            }
        }
        if (this.muteBtn) {
            this.muteBtn.setText(this.sound.mute ? 'ЗВУК: ВИМК' : 'ЗВУК: УВІМК');
        }
    }

    togglePause() {
        if (this.isGameOver || this.isWin) return;

        this.isPaused = !this.isPaused;

        if (this.isPaused) {
            this.physics.pause();
            this.zombieSpawnTimer.paused = true;
            this.muteBtn.setText(this.sound.mute ? 'ЗВУК: ВИМК' : 'ЗВУК: УВІМК');
            this.pauseGroup.setVisible(true);
        } else {
            this.physics.resume();
            this.zombieSpawnTimer.paused = false;
            this.pauseGroup.setVisible(false);
            this.exitModalGroup.setVisible(false);
        }
    }

    takeDamage() {
        if (this.isGameOver || this.isWin) return;

        this.lives--;
        if (this.hearts[this.lives]) {
            this.hearts[this.lives].setVisible(false);
        }

        if (this.lives <= 0) {
            this.triggerGameOver();
        }
    }

    triggerGameOver() {
        this.isGameOver = true;
        
        if (this.zombieSpawnTimer) this.zombieSpawnTimer.remove();
        if (this.levelTimerEvent) this.levelTimerEvent.remove();
        this.physics.pause();

        if (this.currentTrack && this.currentTrack.isPlaying) {
            this.currentTrack.pause();
        }

        this.specialTrack = this.sound.add('game_over', { volume: 0.7 });
        this.specialTrack.play();

        this.specialTrack.once('complete', () => {
            if (this.currentTrack && this.currentTrack.isPaused) {
                this.currentTrack.resume();
            }
        });

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.65);
        overlay.setDepth(1000);

        this.add.text(640, 240, 'ГРУ ЗАКІНЧЕНО', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '44px',
            fill: '#ffffff',
            align: 'center'
        }).setOrigin(0.5).setDepth(1001);

        // Кнопка 1: Почати знову
        let restartText = this.add.text(640, 350, 'ПОЧАТИ ЗНОВУ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#4a3b22',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        restartText.on('pointerover', () => restartText.setStyle({ fill: '#ffcc00', backgroundColor: '#332714' }));
        restartText.on('pointerout', () => restartText.setStyle({ fill: '#ffffff', backgroundColor: '#4a3b22' }));
        restartText.on('pointerdown', () => {
            this.stopAllMusic();
            this.scene.restart();
        });

        // Кнопка 2: Повернутись в меню
        let menuText = this.add.text(640, 440, 'ПОВЕРНУТИСЬ В МЕНЮ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#362714',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        menuText.on('pointerover', () => menuText.setStyle({ fill: '#ffcc00', backgroundColor: '#543e20' }));
        menuText.on('pointerout', () => menuText.setStyle({ fill: '#ffffff', backgroundColor: '#362714' }));
        menuText.on('pointerdown', () => {
            this.stopAllMusic();
            this.scene.start('MenuScene');
        });
    }

    triggerWin() {
        this.isWin = true;

        let completionTime = this.elapsedSeconds;
        let bestTime = localStorage.getItem('patron_best_time');

        if (!bestTime || completionTime < parseFloat(bestTime)) {
            localStorage.setItem('patron_best_time', completionTime);
        }

        let wins = parseInt(localStorage.getItem('patron_wins_count') || 0) + 1;
        localStorage.setItem('patron_wins_count', wins);

        if (this.zombieSpawnTimer) this.zombieSpawnTimer.remove();
        if (this.levelTimerEvent) this.levelTimerEvent.remove();
        this.physics.pause();

        if (this.currentTrack && this.currentTrack.isPlaying) {
            this.currentTrack.pause();
        }

        this.specialTrack = this.sound.add('invincible', { volume: 0.7 });
        this.specialTrack.play();

        this.specialTrack.once('complete', () => {
            if (this.currentTrack && this.currentTrack.isPaused) {
                this.currentTrack.resume();
            }
        });

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.7);
        overlay.setDepth(1000);

        this.add.text(640, 210, 'ПЕРЕМОГА!', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '54px',
            fill: '#ffcc00',
            align: 'center'
        }).setOrigin(0.5).setDepth(1001);

        this.add.text(640, 290, `ЧАС ПРОХОДЖЕННЯ: ${formatTime(completionTime)}`, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '20px',
            fill: '#ffffff'
        }).setOrigin(0.5).setDepth(1001);

        let retryText = this.add.text(640, 390, 'ПОВТОРИТИ ЗНОВУ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '24px',
            fill: '#ffffff',
            backgroundColor: '#4a3b22',
            padding: { x: 20, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        let countdown = 10;
        let timerText = this.add.text(640, 480, `ПОВЕРНЕННЯ ДО МЕНЮ ЧЕРЕЗ: ${countdown}`, {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '18px',
            fill: '#cccccc'
        }).setOrigin(0.5).setDepth(1001);

        this.winTimerEvent = this.time.addEvent({
            delay: 1000,
            callback: () => {
                countdown--;
                timerText.setText(`ПОВЕРНЕННЯ ДО МЕНЮ ЧЕРЕЗ: ${countdown}`);
                if (countdown <= 0) {
                    this.stopAllMusic();
                    this.scene.start('MenuScene');
                }
            },
            callbackScope: this,
            loop: true
        });

        retryText.on('pointerover', () => retryText.setStyle({ fill: '#ffcc00', backgroundColor: '#332714' }));
        retryText.on('pointerout', () => retryText.setStyle({ fill: '#ffffff', backgroundColor: '#4a3b22' }));

        retryText.on('pointerdown', () => {
            if (this.winTimerEvent) this.winTimerEvent.remove();
            this.stopAllMusic();
            this.scene.restart();
        });
    }

    stopAllMusic() {
        if (this.currentTrack) {
            this.currentTrack.stop();
            this.currentTrack.destroy();
            this.currentTrack = null;
        }
        if (this.specialTrack) {
            this.specialTrack.stop();
            this.specialTrack.destroy();
            this.specialTrack = null;
        }
    }

    playNextTrack() {
        let selectedKey = 'wagners';

        if (this.isFirstTrack) {
            selectedKey = 'wagners';
            this.isFirstTrack = false;
        } else {
            let randomIndex = Phaser.Math.Between(0, this.tracksList.length - 1);
            selectedKey = this.tracksList[randomIndex];
        }

        if (!this.cache.audio.exists(selectedKey)) {
            selectedKey = 'music_main';
        }

        this.currentTrack = this.sound.add(selectedKey, { volume: 0.5 });

        this.currentTrack.once('complete', () => {
            if (!this.isGameOver && !this.isWin) {
                this.playNextTrack();
            }
        });

        this.currentTrack.play();
    }

    shootArrow(pointer) {
        let arrow = this.arrows.create(this.patron.x, this.patron.y, 'arrow');
        arrow.setScale(0.12);
        arrow.setDepth(11);
        
        let angle = Phaser.Math.Angle.Between(this.patron.x, this.patron.y, pointer.x, pointer.y);
        arrow.rotation = angle;
        
        this.physics.velocityFromRotation(angle, 700, arrow.body.velocity);
    }

    spawnZombie() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        let groundY = Phaser.Math.Between(600, 690);
        let startX = Phaser.Math.Between(1310, 1370);

        let zombie = this.zombies.create(startX, groundY, 'zombie');
        zombie.setOrigin(0.5, 1);
        zombie.setDepth(Math.floor(groundY));

        let typeRoll = Phaser.Math.Between(1, 100);
        let speed, scale, hp, reward;

        if (typeRoll <= 25) {
            scale = 0.45;
            speed = Phaser.Math.Between(-210, -160);
            hp = 1;
            reward = 30;
        } else if (typeRoll <= 40) {
            scale = 0.85;
            speed = Phaser.Math.Between(-80, -50);
            hp = 2;
            reward = 100;
        } else {
            scale = 0.65;
            speed = Phaser.Math.Between(-130, -90);
            hp = 1;
            reward = 30;
        }

        zombie.setScale(scale);
        zombie.setVelocityX(speed);
        
        zombie.hp = hp;
        zombie.reward = reward;
    }

    hitZombie(arrow, zombie) {
        if (arrow.active && zombie.active && !zombie.isDying) {
            arrow.destroy();

            zombie.hp -= 1;

            zombie.setTint(0xff0000);
            this.time.delayedCall(100, () => {
                if (zombie && zombie.active) {
                    zombie.clearTint();
                }
            });

            if (zombie.hp <= 0) {
                let deathX = zombie.x;
                let startY = zombie.y - (zombie.height * zombie.scaleY * 0.5); 
                let groundY = zombie.y - 10; 
                let earnedPoints = zombie.reward || 30;
                let currentDepth = zombie.depth;

                zombie.destroy();

                if (this.pigSound) {
                    this.pigSound.play();
                }

                let apple = this.add.image(deathX, startY, 'apple');
                apple.setScale(0.08);
                apple.setDepth(currentDepth);

                this.tweens.add({
                    targets: apple,
                    y: groundY,
                    duration: 400,
                    ease: 'Bounce.easeOut',
                    onComplete: () => {
                        this.tweens.add({
                            targets: apple,
                            alpha: 0,
                            duration: 1000,
                            delay: 600,
                            onComplete: () => {
                                apple.destroy();
                            }
                        });
                    }
                });
                
                this.score += earnedPoints;
                this.scoreText.setText('Очки: ' + this.score + ' / 1488');

                if (this.score >= 1488 && !this.isWin) {
                    this.triggerWin();
                }
            }
        }
    }
}

    // -------------------------------------------------------------------
// 6. ДРУГИЙ РІВЕНЬ: БАНКИ ОГІРКІВ ПРОТИ ДРОНІВ
// -------------------------------------------------------------------
class GameSceneLevel2 extends Phaser.Scene {
    constructor() {
        super({ key: 'GameSceneLevel2' });
    }

    create() {
        stopMenuMusic(this);

        this.isGameOver = false;
        this.isWin = false;
        this.isPaused = false;
        this.score = 0;
        this.targetScore = 1000;
        this.lives = 5;
        this.hearts = [];
        
        this.lastFired = 0;
        this.fireRateDelay = 600; 
        this.elapsedSeconds = 0;

        // Вмикаємо гравітацію для польоту банок по дузі
        this.physics.world.gravity.y = 600;

        let bg = this.add.image(640, 360, 'background');
        bg.setDisplaySize(1280, 720).setDepth(0);

        // Патрон ліворуч умовно "у вікні"
        this.patron = this.add.image(150, 200, 'patron').setOrigin(0.5).setScale(0.3).setDepth(10);

        this.jars = this.physics.add.group();
        this.drones = this.physics.add.group();

        this.scoreText = this.add.text(40, 40, `Очки: 0 / ${this.targetScore}`, { 
            fontFamily: '"Press Start 2P", monospace', 
            fontSize: '20px', 
            fill: '#ffffff' 
        }).setDepth(100);

        this.timerText = this.add.text(40, 70, 'Час: 00:00', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '16px',
            fill: '#ffe57f'
        }).setDepth(100);

        for (let i = 0; i < 5; i++) {
            let heart = this.add.image(1280 - 60 - (i * 65), 55, 'heart');
            heart.setScale(0.16).setDepth(100);
            this.hearts.push(heart);
        }

        this.levelTimerEvent = this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (!this.isPaused && !this.isGameOver && !this.isWin) {
                    this.elapsedSeconds++;
                    this.timerText.setText('Час: ' + formatTime(this.elapsedSeconds));
                }
            },
            callbackScope: this,
            loop: true
        });

        // Кидок банки по кліку мишки
        this.input.on('pointerdown', (pointer) => {
            if (this.isGameOver || this.isWin || this.isPaused) return;

            let now = this.time.now;
            if (now - this.lastFired >= this.fireRateDelay) {
                this.throwJar(pointer);
                this.lastFired = now;
            }
        });

        // Поява дронів
        this.droneSpawnTimer = this.time.addEvent({
            delay: 1200,
            callback: this.spawnDrone,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.jars, this.drones, this.hitDrone, null, this);
    }

    update() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        // Обертання банки в повітрі
        this.jars.children.each((jar) => {
            if (jar && jar.active) {
                jar.rotation += 0.1;
                if (jar.y > 750 || jar.x > 1300 || jar.x < -50) {
                    jar.destroy();
                }
            }
        });

        // Коливання дронів у повітрі
        this.drones.children.each((drone) => {
            if (drone && drone.active) {
                drone.y += Math.sin(this.time.now / 200) * 0.8;

                if (drone.x < 150 && !drone.isDying) {
                    drone.isDying = true;
                    this.takeDamage();
                    drone.destroy();
                }
            }
        });
    }

    throwJar(pointer) {
        // Поки немає фото банки — використовуємо тимчасово картинку яблука ('apple')
        let jarKey = this.textures.exists('jar') ? 'jar' : 'apple';
        let jar = this.jars.create(this.patron.x + 30, this.patron.y, jarKey);
        jar.setScale(0.12).setDepth(11);

        let targetX = pointer.x;
        let targetY = pointer.y;

        let angle = Phaser.Math.Angle.Between(this.patron.x, this.patron.y, targetX, targetY);
        let speed = 800; // Початкова швидкість

        // Встановлюємо фізичний вектор кидка
        jar.body.setVelocityX(Math.cos(angle) * speed);
        jar.body.setVelocityY(Math.sin(angle) * speed);
    }

    spawnDrone() {
        if (this.isGameOver || this.isWin || this.isPaused) return;

        let spawnY = Phaser.Math.Between(100, 500);
        // Поки немає фото дрона — використовуємо тимчасово 'zombie'
        let droneKey = this.textures.exists('drone') ? 'drone' : 'zombie';
        let drone = this.drones.create(1320, spawnY, droneKey);
        
        drone.setScale(0.5);
        drone.body.allowGravity = false; // Дрони не падають від гравітації
        drone.setVelocityX(Phaser.Math.Between(-220, -130));
    }

    hitDrone(jar, drone) {
        if (jar.active && drone.active) {
            jar.destroy();
            drone.destroy();

            this.score += 50;
            this.scoreText.setText(`Очки: ${this.score} / ${this.targetScore}`);

            if (this.score >= this.targetScore && !this.isWin) {
                this.triggerWin();
            }
        }
    }

    takeDamage() {
        this.lives--;
        if (this.hearts[this.lives]) {
            this.hearts[this.lives].setVisible(false);
        }
        if (this.lives <= 0) {
            this.triggerGameOver();
        }
    }

    triggerGameOver() {
        this.isGameOver = true;
        this.physics.pause();
        if (this.droneSpawnTimer) this.droneSpawnTimer.remove();

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.65).setDepth(1000);

        this.add.text(640, 240, 'ДРОНИ ПРОБИЛИСЯ!', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '36px',
            fill: '#ff2222'
        }).setOrigin(0.5).setDepth(1001);

        let restartText = this.add.text(640, 350, 'ПОЧАТИ ЗНОВУ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#4a3b22',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        restartText.on('pointerdown', () => this.scene.restart());

        let menuText = this.add.text(640, 440, 'ПОВЕРНУТИСЬ В МЕНЮ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#362714',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        menuText.on('pointerdown', () => this.scene.start('MenuScene'));
    }

    triggerWin() {
        this.isWin = true;
        this.physics.pause();
        if (this.droneSpawnTimer) this.droneSpawnTimer.remove();

        let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.7).setDepth(1000);

        this.add.text(640, 250, 'НЕБО ЧИСТЕ!', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '44px',
            fill: '#ffe57f'
        }).setOrigin(0.5).setDepth(1001);

        let menuBtn = this.add.text(640, 380, 'В МЕНЮ', {
            fontFamily: '"Press Start 2P", monospace',
            fontSize: '22px',
            fill: '#ffffff',
            backgroundColor: '#362714',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(1001);

        menuBtn.on('pointerdown', () => this.scene.start('MenuScene'));
    }
}
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: [PreloaderScene, MenuScene, SettingsScene, HighscoresScene, LevelSelectScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
