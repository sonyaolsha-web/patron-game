<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пес Патрон VS Пригожин</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let patron, arrows, zombies, apples, scoreText;
let score = 0;
let lastFired = 0;

// Змінні системи життів
let lives = 5;
let hearts = [];
let isGameOver = false;
let gameOverText, restartText, zombieSpawnTimer;

// Змінні для звуків
let currentTrack = null;
let tracksList = [];
let pigSound;

function preload() {
    // Картинки
    this.load.image('background', 'assets/background.png');
    this.load.image('tower', 'assets/tower.png');
    this.load.image('patron', 'assets/patron.png');
    this.load.image('arrow', 'assets/arrow.png');
    this.load.image('zombie', 'assets/zombie.png');
    this.load.image('heart', 'assets/heart.png');
    this.load.image('apple', 'assets/apple.png'); // Яблуко

    // Аудіофайли
    this.load.audio('pig_sound', 'assets/pig.mp3'); // Звук свині
    this.load.audio('music_main', 'assets/music_main.mp3');
    this.load.audio('stefania', 'assets/stefania.mp3');
    this.load.audio('donbass', 'assets/donbass.mp3');
    this.load.audio('sorry', 'assets/sorry.mp3');
    this.load.audio('wagners', 'assets/wagners.mp3');
    this.load.audio('invincible', 'assets/invincible.mp3');
}

function create() {
    isGameOver = false;
    score = 0;
    lives = 5;
    hearts = [];

    let bg = this.add.image(640, 360, 'background');
    bg.setDisplaySize(1280, 720);

    let tower = this.add.image(120, 520, 'tower');
    tower.setScale(0.8);

    patron = this.add.image(120, 330, 'patron').setOrigin(0.5, 0.5);
    patron.setScale(0.30);

    arrows = this.physics.add.group();
    zombies = this.physics.add.group();
    apples = this.add.group(); // Група для яблук

    // Звук свині (volume: 0.35 — тихий, але добре чутний)
    pigSound = this.sound.add('pig_sound', { volume: 0.35 });

    scoreText = this.add.text(24, 24, 'Очки: 0', { 
        fontFamily: '"Press Start 2P", monospace', 
        fontSize: '24px', 
        fill: '#ffffff' 
    });

    // Сердечка (збільшено масштаб з 0.08 до 0.16 та розширено крок до 65px)
    for (let i = 0; i < 5; i++) {
        let heart = this.add.image(1280 - 60 - (i * 65), 55, 'heart');
        heart.setScale(0.16); 
        hearts.push(heart);
    }

    tracksList = [
        { key: 'music_main', weight: 70 },
        { key: 'stefania',   weight: 6  },
        { key: 'donbass',    weight: 6  },
        { key: 'sorry',      weight: 6  },
        { key: 'wagners',    weight: 6  },
        { key: 'invincible', weight: 6  }
    ];

    this.input.once('pointerdown', () => {
        if (this.sound.context.state === 'suspended') {
            this.sound.context.resume();
        }
        if (!currentTrack || !currentTrack.isPlaying) {
            playWeightedTrack.call(this);
        }
    });

    this.input.on('pointerdown', (pointer) => {
        if (isGameOver) return;
        
        let time = this.time.now;
        if (time > lastFired) {
            shootArrow.call(this, pointer);
            lastFired = time + 400;
        }
    });

    zombieSpawnTimer = this.time.addEvent({
        delay: 1500,
        callback: spawnZombie,
        callbackScope: this,
        loop: true
    });

    this.physics.add.overlap(arrows, zombies, hitZombie, null, this);
}

function update() {
    if (isGameOver) return;

    let pointer = this.input.activePointer;
    let angle = Phaser.Math.Angle.Between(patron.x, patron.y, pointer.x, pointer.y);
    patron.rotation = angle;

    arrows.children.each((arrow) => {
        if (arrow && arrow.active) {
            if (arrow.x > 1300 || arrow.y > 750 || arrow.y < -50 || arrow.x < -50) {
                arrow.destroy();
            }
        }
    });

    zombies.children.each((zombie) => {
        if (zombie && zombie.active && zombie.x < 120) {
            zombie.destroy();
            takeDamage.call(this);
        }
    });
}

function takeDamage() {
    if (isGameOver) return;

    lives--;
    if (hearts[lives]) {
        hearts[lives].setVisible(false);
    }

    if (lives <= 0) {
        triggerGameOver.call(this);
    }
}

function triggerGameOver() {
    isGameOver = true;
    
    if (zombieSpawnTimer) zombieSpawnTimer.remove();
    this.physics.pause();

    // Чорний напівпрозорий прямокутник для затемнення (альфа 0.65)
    let overlay = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.65);

    gameOverText = this.add.text(640, 300, 'ГРУ ЗАКІНЧЕНО', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '44px',
        fill: '#ffffff',
        align: 'center'
    }).setOrigin(0.5);

    restartText = this.add.text(640, 400, 'ПОЧАТИ ЗНОВУ', {
        fontFamily: '"Press Start 2P", monospace',
        fontSize: '26px',
        fill: '#ffffff',
        align: 'center'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    restartText.on('pointerover', () => restartText.setStyle({ fill: '#ffcc00' }));
    restartText.on('pointerout', () => restartText.setStyle({ fill: '#ffffff' }));

    restartText.on('pointerdown', () => {
        this.scene.restart();
    });
}

function playWeightedTrack() {
    let totalWeight = tracksList.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Phaser.Math.Between(1, totalWeight);
    let selectedKey = tracksList[0].key;

    for (let track of tracksList) {
        if (randomNum <= track.weight) {
            selectedKey = track.key;
            break;
        }
        randomNum -= track.weight;
    }

    currentTrack = this.sound.add(selectedKey, { volume: 0.5 });

    currentTrack.once('complete', () => {
        playWeightedTrack.call(this);
    });

    currentTrack.play();
}

function shootArrow(pointer) {
    let arrow = arrows.create(patron.x, patron.y, 'arrow');
    arrow.setScale(0.15);
    
    let angle = Phaser.Math.Angle.Between(patron.x, patron.y, pointer.x, pointer.y);
    arrow.rotation = angle;
    
    this.physics.velocityFromRotation(angle, 600, arrow.body.velocity);
}

function spawnZombie() {
    if (isGameOver) return;
    let y = Phaser.Math.Between(450, 650);
    let zombie = zombies.create(1320, y, 'zombie');
    zombie.setScale(0.65);
    zombie.setVelocityX(-80);
}

function hitZombie(arrow, zombie) {
    if (arrow.active && zombie.active) {
        // Отримуємо координати смерті зомбі перед знищенням
        let deathX = zombie.x;
        let deathY = zombie.y;

        arrow.destroy();
        zombie.destroy();

        // Граємо звук свині при влучанні
        if (pigSound) {
            pigSound.play();
        }

        // Створюємо яблуко на місці зомбі
        let apple = this.add.image(deathX, deathY, 'apple');
        apple.setScale(0.12);

        // Плавне зникання яблука протягом 2 секунд
        this.tweens.add({
            targets: apple,
            alpha: 0,
            duration: 2000,
            delay: 1000, // 1 секунду лежить, потім 2 секунди зникає
            onComplete: () => {
                apple.destroy();
            }
        });
        
        score += 10;
        scoreText.setText('Очки: ' + score);
    }
}
</script>

</body>
</html>
